name: geodiario
description: "GeoDiário - registro de fotografias com data, hora e geolocalização."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Persistência local (SQLite)
  sqflite: ^2.4.2
  path: ^1.9.0
  # Diretório local para salvar as fotos
  path_provider: ^2.1.5
  # Captura de fotografias pela câmera
  image_picker: ^1.1.2
  # GPS (latitude / longitude)
  geolocator: ^14.0.2
  # Formatação de data e hora
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
